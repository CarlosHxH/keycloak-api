# Uso local (docker compose up): carregado automaticamente junto do docker-compose.yaml.
# O Coolify usa só o docker-compose.yaml e ignora este arquivo.
services:
  keycloak:
    image: keycloak-api:local
    container_name: keycloak-api
    ports:
      - "${PORT:-9090}:9090"
    environment:
      MOCK_KEYCLOAK_URL: ${MOCK_KEYCLOAK_URL:-http://localhost:9090}
      MOCK_PAINEL_SENHA: ${MOCK_PAINEL_SENHA:-}
